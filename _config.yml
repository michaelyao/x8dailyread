theme: minima
title: x8dailyread
description: Daily tech blog reading notes from 91 HN community blogs

# Jekyll settings
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Process markdown files
defaults:
  -
    scope:
      path: "posts"
      type: "posts"
    values:
      layout: "post"

# Exclude files from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - fix_posts.sh
